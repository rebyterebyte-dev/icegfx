name: IMPOSTER – Webseite & Android-APK

on:
  push:
    branches: [main, 'claude/imposter-online-game-1xle97']
    paths: ['imposter/**', '.github/workflows/imposter.yml']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: imposter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Android APK bauen
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: imposter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Android-Projekt erzeugen
        run: |
          npx cap add android
          npx capacitor-assets generate --android --assetPath assets
          npx cap sync android
      - name: APK bauen
        working-directory: imposter/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../imposter.apk
      - uses: actions/upload-artifact@v4
        with:
          name: imposter-apk
          path: imposter/imposter.apk
      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: imposter-v1.0.${{ github.run_number }}
          name: IMPOSTER v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            🎮 IMPOSTER – Partyspiel für Android.
            APK herunterladen, auf dem Handy öffnen und „Installation aus unbekannten Quellen“ erlauben.
          files: imposter/imposter.apk

  pages:
    name: Webseite veröffentlichen (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Einmalig nötig: Repo → Settings → Pages → Source: „GitHub Actions“
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: imposter/www
      - id: deploy
        uses: actions/deploy-pages@v4
