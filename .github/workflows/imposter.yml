name: IMPOSTER – Webseite & Android-APK

on:
  push:
    branches: [main, 'claude/imposter-online-game-1xle97']
    paths: ['imposter/**', '.github/workflows/imposter.yml']
  workflow_dispatch:

permissions:
  contents: write
  pages:
    name: Webseite auf gh-pages veröffentlichen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: www nach gh-pages kopieren
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r imposter/www /tmp/site && touch /tmp/site/.nojekyll
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          git rm -rq . && git clean -fdq
          cp -r /tmp/site/. .
          git add -A
          git diff --cached --quiet || (git commit -m "Update website from ${GITHUB_SHA::7}" && git push origin gh-pages)
